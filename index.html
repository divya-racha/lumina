<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina — Interactive 3D Science Explorer</title>
<meta name="description" content="A free interactive 3D atlas for biology, biochemistry, organic chemistry, neuroscience, geology and MCAT prep. Explore, quiz yourself, master the material.">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <p>Preparing the atlas&hellip;</p>
</div>

<div id="scene"></div>

<header id="topbar">
  <div class="brand">
    <span class="logo">&#x1F52C;</span>
    <div>
      <h1>Lumina</h1>
      <p>A free interactive 3D atlas for biology, biochemistry, organic chemistry, neuroscience, geology &amp; MCAT prep.</p>
    </div>
  </div>
  <nav id="tabs">
    <button class="tab active" data-atlas="anatomy">&#x1F9B4; Anatomy</button>
    <button class="tab" data-atlas="cell">&#x1F9A0; Animal Cell</button>
    <button class="tab" data-atlas="plantcell">&#x1F331; Plant Cell</button>
    <button class="tab" data-atlas="neuron">&#x1F9E0; Neuron Lab</button>
    <button class="tab" data-atlas="molecules">&#x269B;&#xFE0F; Molecules</button>
    <button class="tab" data-atlas="ochem">&#x1F9EA; Ochem Studio</button>
    <button class="tab" data-atlas="biochem">&#x1F9EC; Biochem</button>
    <button class="tab" data-atlas="earth">&#x1F30D; Earth</button>
    <button class="tab" data-atlas="ecology">&#x1F33F; Ecology</button>
  </nav>
  <div id="top-actions">
    <button id="passage-btn" class="quiz-btn">&#x1F4D6; Passages</button>
    <button id="mcat-btn" class="quiz-btn">&#x2695;&#xFE0F; MCAT Prep</button>
    <button id="quiz-btn" class="quiz-btn">&#x1F3AF; Quiz me</button>
  </div>
</header>

<button id="panel-toggle" aria-label="Toggle systems panel">&#x2630;</button>

<aside id="panel-left">
  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Search parts&hellip;" autocomplete="off" aria-label="Search parts">
    <div id="search-results"></div>
  </div>
  <div id="systems"></div>
  <div id="atlas-meta"></div>
</aside>

<aside id="info-card">
  <button id="info-close" aria-label="Close">&times;</button>
  <div id="info-body"></div>
</aside>

<div id="hint">Drag to orbit &middot; Scroll / pinch to zoom &middot; Click any part to inspect it</div>

<div id="quiz-bar" hidden></div>

<div id="passage-banner" hidden></div>

<aside id="passage-dock" hidden>
  <button id="passage-dock-x" aria-label="Exit passage">&times;</button>
  <div id="passage-dock-body"></div>
</aside>

<div id="passage-menu" hidden>
  <div id="passage-menu-card">
    <div id="passage-menu-body"></div>
  </div>
</div>

<div id="passage-end" hidden>
  <div id="passage-end-card">
    <div id="passage-end-body"></div>
  </div>
</div>

<div id="micro-bar" hidden></div>

<div id="micro-modal" hidden>
  <div id="micro-modal-card">
    <div id="micro-modal-body"></div>
  </div>
</div>

<div id="mcat-menu" hidden>
  <div id="mcat-menu-card">
    <div id="mcat-menu-body"></div>
  </div>
</div>

<div id="learn-chip">
  <button id="learn-chip-go"><span>&#x26A1; Quick check</span><small>1 question</small></button>
  <button id="learn-chip-x" aria-label="Dismiss">&times;</button>
</div>

<div id="confetti"></div>

<div id="quiz-end" hidden>
  <div id="quiz-end-card">
    <div id="quiz-end-body"></div>
  </div>
</div>

<div id="explode-bar">
  <span class="lbl">Assembled</span>
  <input type="range" id="explode" min="0" max="100" value="0" step="1">
  <span class="lbl">Exploded</span>
  <span id="explode-val">0%</span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
